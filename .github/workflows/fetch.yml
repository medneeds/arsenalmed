name: fetch-media
on:
  push:
    branches: [media-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ads-assets
      - name: Baixar narração
        run: |
          mkdir -p ads/final
          curl -sSL -A "Mozilla/5.0" -o ads/final/voz-video59-pode-falhar.mp3 "https://elevenlabsusercontent.com/database/workspace/fdc59b2b7cea468d82ce072314953f01/content_generation/bt3HyJzmKxAYsJekWoZ3/XkH1FX5XfRZ2Qwr9CLfe/content.mp3?Expires=1793718000&KeyName=assets-cdn-key-1&Signature=Vuc07vjV8hVG7ETBqg7y5SA3CJw="
          echo "::warning::DL $(ls -la ads/final/voz-video59-pode-falhar.mp3)"
      - name: Commit
        run: |
          set +e
          git config user.name "arsenal-media-bot"; git config user.email "actions@users.noreply.github.com"
          git add ads/final/voz-video59-pode-falhar.mp3; git commit -qm "Narração do vídeo de 59 s com 'pode falhar'"
          git push origin HEAD:ads-assets > o.log 2>&1; echo "::warning::PUSH rc=$? $(tr '\n' ' ' < o.log | cut -c1-300)"
